<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portfolio{% endblock %}</title>
  <meta name="description" content="{% block description %}Personal portfolio — projects, poetry, and more.{% endblock %}">

  <!-- Prevent light-mode flash: runs synchronously before CSS -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- AOS — Animate On Scroll -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS (includes :root tokens) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Tailwind CDN with extended config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          gridTemplateColumns: {
            'sidebar': '380px 1fr',
          }
        }
      }
    }
  </script>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-bg-primary text-tx-primary font-body min-h-screen flex flex-col">

  <!-- ================================================================
       NAVIGATION
       ================================================================ -->
  <nav class="nav-blur fixed top-0 left-0 right-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">

      <!-- Logo -->
      <a href="{{ url_for('index') }}" class="font-display italic text-xl text-accent tracking-wide hover:opacity-80 transition-opacity">
        Solomon Shasanmi
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-8">
        <a href="{{ url_for('index') }}"
           class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
          Home
        </a>
        <a href="{{ url_for('projects') }}"
           class="nav-link {% if request.endpoint in ('projects', 'project_detail') %}active{% endif %}">
          Projects
        </a>
        <a href="{{ url_for('poetry') }}"
           class="nav-link {% if request.endpoint in ('poetry', 'poem_detail') %}active{% endif %}">
          Poetry
        </a>

        <!-- Theme toggle -->
        <button id="theme-toggle" aria-label="Toggle theme"
                class="w-8 h-8 flex items-center justify-center rounded-full border border-bd hover:border-gold transition-colors text-tx-secondary hover:text-gold">
          <!-- Sun icon (shown in dark mode to switch to light) -->
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 7a5 5 0 110 10A5 5 0 0112 7z"/>
          </svg>
          <!-- Moon icon (shown in light mode to switch to dark) -->
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>
          </svg>
        </button>
      </div>

      <!-- Mobile hamburger -->
      <button id="menu-toggle" aria-label="Open menu" aria-expanded="false"
              class="md:hidden w-9 h-9 flex flex-col items-center justify-center gap-[5px] group">
        <span class="hamburger-line block w-5 h-px bg-tx-secondary group-hover:bg-gold transition-all duration-300"></span>
        <span class="hamburger-line block w-5 h-px bg-tx-secondary group-hover:bg-gold transition-all duration-300"></span>
        <span class="hamburger-line block w-3 h-px bg-tx-secondary group-hover:bg-gold transition-all duration-300 self-start"></span>
      </button>
    </div>

    <!-- Mobile menu drawer -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-bd">
      <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col gap-5">
        <a href="{{ url_for('index') }}" class="nav-link text-base {% if request.endpoint == 'index' %}active{% endif %}">Home</a>
        <a href="{{ url_for('projects') }}" class="nav-link text-base {% if request.endpoint in ('projects', 'project_detail') %}active{% endif %}">Projects</a>
        <a href="{{ url_for('poetry') }}" class="nav-link text-base {% if request.endpoint in ('poetry', 'poem_detail') %}active{% endif %}">Poetry</a>
        <div class="flex items-center gap-3 pt-2">
          <button id="theme-toggle-mobile" aria-label="Toggle theme"
                  class="text-tx-secondary hover:text-gold text-sm font-mono transition-colors">
            Toggle Theme
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ================================================================
       PAGE CONTENT
       ================================================================ -->
  <main class="pt-16 flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- ================================================================
       FOOTER
       ================================================================ -->
  <footer class="border-t border-bd mt-20 py-10">
    <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <p class="font-mono text-xs text-tx-secondary tracking-widest">
        &copy; {{ 2026 }} &mdash; Solomon Shasanmi
      </p>
      <div class="flex items-center gap-6">
        <a href="mailto:solomonshasami@gmail.com" class="footer-link font-mono text-xs tracking-wide">Email</a>
        <a href="https://github.com/TheeGreenGenie" target="_blank" rel="noopener" class="footer-link font-mono text-xs tracking-wide">GitHub</a>
        <a href="https://www.linkedin.com/in/solomon-shasanmi-a38b32245/" target="_blank" rel="noopener" class="footer-link font-mono text-xs tracking-wide">LinkedIn</a>
      </div>
    </div>
  </footer>

  <!-- ================================================================
       SCRIPTS
       ================================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
